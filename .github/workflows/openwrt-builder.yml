name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
  push:
    paths:
      - '.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - 'feeds.conf.default'
  # schedule:
  #   - cron: '0 20 * * 6'  # 每周六北京时间凌晨4点自动构建

permissions:
  contents: write
  
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    # timeout-minutes: 360  # 6小时超时

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && cp $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && cp -r files openwrt/files
        [ -e $CONFIG_FILE ] && cp $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) thread compile"
        
        # 尝试编译
        make -j$(nproc) || make -j1 || make -j1 V=s
        
        # 检查编译是否成功
        if [ ! -d "bin/targets" ]; then
          echo "错误：bin/targets 目录不存在，编译失败"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        # 检查是否有固件文件生成
        FIRMWARE_COUNT=$(find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" -o -name "*.zip" \) 2>/dev/null | wc -l)
        if [ "$FIRMWARE_COUNT" -eq 0 ]; then
          echo "错误：未找到固件文件，编译可能失败"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        echo "成功生成 $FIRMWARE_COUNT 个固件文件"
        echo "status=success" >> $GITHUB_OUTPUT
        
        # 生成设备名称和日期标签
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        if [ -s DEVICE_NAME ]; then
          DEVICE_NAME_CLEAN=$(cat DEVICE_NAME | head -1)
          echo "DEVICE_NAME=_${DEVICE_NAME_CLEAN}" >> $GITHUB_ENV
        else
          echo "DEVICE_NAME=" >> $GITHUB_ENV
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: always() && !cancelled()
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
        retention-days: 30

    - name: Organize files
      id: organize
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        # 查找固件实际路径
        cd openwrt
        
        # 尝试多个可能的路径
        if [ -d "bin/targets" ]; then
          # 查找包含固件文件的目录
          FIRMWARE_DIR=$(find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" -o -name "*.zip" \) 2>/dev/null | head -1 | xargs dirname 2>/dev/null || echo "")
        fi
        
        # 如果没找到，尝试其他路径
        if [ -z "$FIRMWARE_DIR" ] || [ ! -d "$FIRMWARE_DIR" ]; then
          FIRMWARE_DIR=$(find bin -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" -o -name "*.zip" \) 2>/dev/null | head -1 | xargs dirname 2>/dev/null || echo "")
        fi
        
        if [ -z "$FIRMWARE_DIR" ] || [ ! -d "$FIRMWARE_DIR" ]; then
          echo "错误：找不到固件目录"
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "当前 bin 目录结构："
          ls -la bin/ 2>/dev/null || echo "bin 目录不存在"
          ls -la bin/targets/ 2>/dev/null || echo "bin/targets 目录不存在"
          exit 1
        fi
        
        cd "$FIRMWARE_DIR"
        
        # 删除 packages 目录（如果存在）
        rm -rf packages 2>/dev/null
        
        echo "固件目录: $PWD"
        echo "固件文件列表:"
        ls -lh *.bin *.img *.gz *.zip 2>/dev/null || echo "未找到固件文件"
        
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 30

    - name: Generate release tag
      id: tag
      if: steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      run: |
        RELEASE_TAG="$(date +"%Y.%m.%d-%H%M")"
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
        
        # 创建 release 说明
        cat > release.txt << EOF
## OpenWrt 固件自动构建

- **构建时间**: $(date +"%Y-%m-%d %H:%M:%S %Z")
- **源代码**: ${{ env.REPO_URL }}
- **分支**: ${{ env.REPO_BRANCH }}
- **设备**: ${{ env.DEVICE_NAME }}

### 固件说明
- 固件文件位于下方 Assets 中
- 下载后请验证文件完整性
- 刷机前请备份重要数据

### 注意事项
- 本固件由 GitHub Actions 自动构建
- 使用前请仔细阅读相关文档
- 刷机有风险，请谨慎操作
EOF
        
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: "OpenWrt Build ${{ steps.tag.outputs.release_tag }}"
        body_path: release.txt
        files: |
          ${{ env.FIRMWARE }}/*.bin
          ${{ env.FIRMWARE }}/*.img
          ${{ env.FIRMWARE }}/*.gz
          ${{ env.FIRMWARE }}/*.zip
        draft: false
        prerelease: false

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      if: always()
      with:
        retain_days: 30
        keep_minimum_runs: 5

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && success()
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
