#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/openwrt-builder.yml
# Description: Build OpenWrt using GitHub Actions
#

name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:
  push:
    paths:
      - '.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
  schedule:
    - cron: '0 20 * * 6'

permissions:
  contents: write
  
env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: List repository files
      run: |
        echo "=== 仓库根目录文件列表 ==="
        ls -la
        echo "=== 检查必需文件 ==="
        [ -f "diy-part1.sh" ] && echo "✅ diy-part1.sh 存在" || echo "⚠️ diy-part1.sh 不存在"
        [ -f "diy-part2.sh" ] && echo "✅ diy-part2.sh 存在" || echo "⚠️ diy-part2.sh 不存在"
        [ -f ".config" ] && echo "✅ .config 存在" || echo "❌ .config 不存在"

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds (diy-part1.sh)
      run: |
        echo "=== 运行 diy-part1.sh ==="
        if [ -f $DIY_P1_SH ]; then
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          cd ..
          echo "diy-part1.sh 执行完成"
        else
          echo "diy-part1.sh 不存在，跳过"
        fi

    - name: Update feeds
      run: |
        cd openwrt
        echo "=== 更新 feeds ==="
        ./scripts/feeds update -a
        echo "=== feeds 更新完成 ==="

    - name: Install feeds
      run: |
        cd openwrt
        echo "=== 安装 feeds ==="
        ./scripts/feeds install -a
        echo "=== feeds 安装完成 ==="

    - name: Load custom configuration (diy-part2.sh)
      run: |
        echo "=== 复制自定义文件 ==="
        if [ -d files ]; then
          cp -r files openwrt/files
          echo "已复制 files 目录"
        fi
        
        echo "=== 复制 .config ==="
        if [ -f $CONFIG_FILE ]; then
          cp $CONFIG_FILE openwrt/.config
          echo "已复制 $CONFIG_FILE"
        else
          echo "❌ 错误: $CONFIG_FILE 不存在，无法继续"
          exit 1
        fi
        
        echo "=== 运行 diy-part2.sh ==="
        if [ -f $DIY_P2_SH ]; then
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH
          cd ..
          echo "diy-part2.sh 执行完成"
        else
          echo "diy-part2.sh 不存在，跳过"
        fi

    - name: Check config file
      run: |
        cd openwrt
        echo "=== 检查 .config 文件 ==="
        if [ -f .config ]; then
          echo "✅ .config 文件存在，行数: $(wc -l < .config)"
          echo "前20行内容:"
          head -20 .config
          echo ""
          echo "=== 配置摘要 ==="
          make defconfig > /dev/null 2>&1
          ./scripts/diffconfig.sh | head -30
        else
          echo "❌ 错误: .config 文件不存在"
          exit 1
        fi

    - name: Download package
      id: package
      run: |
        cd openwrt
        echo "=== 运行 make defconfig ==="
        make defconfig 2>&1 | tee defconfig.log
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "❌ make defconfig 失败"
          cat defconfig.log
          exit 1
        fi
        echo "✅ make defconfig 成功"
        
        echo "=== 运行 make download ==="
        make download -j8 2>&1 | tee download.log
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "❌ make download 失败"
          cat download.log
          exit 1
        fi
        echo "✅ make download 成功"
        
        # 检查下载的包
        echo "=== 检查下载的包 ==="
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "开始编译，使用 $(nproc) 个线程"
        
        # 显示编译前信息
        echo "=== 目标信息 ==="
        grep "CONFIG_TARGET" .config | grep "=y" | head -10
        
        # 开始编译
        make -j$(nproc) 2>&1 | tee compile.log
        if [ ${PIPESTATUS[0]} -ne 0 ]; then
          echo "并行编译失败，尝试单线程详细模式"
          make -j1 V=s 2>&1 | tee compile-verbose.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ 编译失败"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
        fi
        
        # 检查编译结果
        if [ ! -d "bin/targets" ]; then
          echo "❌ 错误：bin/targets 目录不存在"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        # 查找固件文件
        echo "=== 查找固件文件 ==="
        find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" -o -name "*.zip" \) -ls
        
        FIRMWARE_COUNT=$(find bin/targets -type f \( -name "*.bin" -o -name "*.img" -o -name "*.gz" -o -name "*.zip" \) 2>/dev/null | wc -l)
        if [ "$FIRMWARE_COUNT" -eq 0 ]; then
          echo "❌ 错误：未找到固件文件"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        echo "✅ 成功生成 $FIRMWARE_COUNT 个固件文件"
        echo "status=success" >> $GITHUB_OUTPUT
        
        # 生成设备名称
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        if [ -s DEVICE_NAME ]; then
          DEVICE_NAME_CLEAN=$(cat DEVICE_NAME | head -1)
          echo "DEVICE_NAME=_${DEVICE_NAME_CLEAN}" >> $GITHUB_ENV
          echo "设备: ${DEVICE_NAME_CLEAN}"
        else
          echo "DEVICE_NAME=" >> $GITHUB_ENV
        fi
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs-${{ github.run_id }}
        path: |
          openwrt/defconfig.log
          openwrt/download.log
          openwrt/compile.log
          openwrt/compile-verbose.log
        retention-days: 7

    - name: Check space usage
      if: always()
      run: df -hT

    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin/targets/*/*
        retention-days: 30

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: openwrt-${{ github.run_id }}
        name: "OpenWrt Build ${{ env.FILE_DATE }}"
        body: |
          ## OpenWrt 固件自动构建
          
          - **构建时间**: ${{ env.FILE_DATE }}
          - **源代码**: ${{ env.REPO_URL }}
          - **分支**: ${{ env.REPO_BRANCH }}
          - **设备**: ${{ env.DEVICE_NAME }}
          
          ### 固件文件
          请下载对应的固件文件刷机。
        files: openwrt/bin/targets/*/*.{bin,img,gz,zip}
        draft: false
        prerelease: false

    - name: Delete old workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      if: always()
      with:
        retain_days: 30
        keep_minimum_runs: 5

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: env.UPLOAD_RELEASE == 'true' && success()
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
